services:
  - type: web
    name: botocop-auditor
    env: python
    # NOTE: Free tier spins down after 15 min of inactivity.
    # The first request after sleep will see a ~30s cold start (503 briefly) -- that is normal Render behaviour.
    # Upgrade to a paid instance or use a cron ping service (e.g. UptimeRobot) to keep the dyno warm.
    buildCommand: "./build.sh"
    startCommand: "uv run uvicorn backend.src.api.server:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: "gemini-2.0-flash"
      - key: CASE_DATABASE_URL
        sync: false   # point at a managed Postgres instance in production
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
