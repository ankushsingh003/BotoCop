services:
  - type: web
    name: botocop-auditor
    env: python
    buildCommand: "./build.sh"
    startCommand: "uv run uvicorn backend.src.api.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: "llama-3.3-70b-versatile"
      - key: CASE_DATABASE_URL
        sync: false   # point at a managed Postgres instance in production
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false


